name: Check TC BNA


on:
  workflow_dispatch:  # permite correrlo manualmente
  schedule:
    - cron: "*/1 15-23 * * *"

  schedule:
    - cron: "*/1 15-23 * * *"  # cada minuto entre las 15 y las 23 hs
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run script
        run: python scripts/check_tc.py
